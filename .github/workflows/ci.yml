name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      [
        chore/sprint-0-project-foundation,
        feature/sprint-1-image-editor-mvp,
        feature/sprint-3-custom-portable,
        feature/sprint-4-3-perspective-video,
        feature/sprint-4-4-photorealistic-rendering,
        feature/sprint-4-5-scene-integration-qa,
      ]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, includes golden-image visual QA)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: digital-signage-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
