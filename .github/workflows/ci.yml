name: CI

# v2-S4 Step 0 — Step 8: active work happens on the `v2` branch, so push CI only runs there
# (removing the pre-v2 sprint-* branch list). `main` sees commits exclusively via the S7
# `v2 → main` pull request, so we route the heavier e2e gate to `pull_request` and keep the
# fast gate on push. Docker build is gated on PR too so the push loop stays snappy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [v2]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:run

      - name: Production build (default base)
        run: npm run build

      - name: Production build (/oitemiru/ base)
        run: npm run build:oitemiru

      # The e2e suite (including golden-image visual QA) only runs on the S7 pull_request
      # into main — pushing to v2 just needs the fast gates above. Keeping Playwright off
      # the push path cuts CI time by ~3 min and avoids spending free-tier minutes on every
      # intermediate commit.
      - name: Install Playwright browsers
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, includes golden-image visual QA)
        if: github.event_name == 'pull_request'
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker build
    # Docker is reproducibility insurance for the S7 release-notes dry-run, not needed on
    # every push into v2. Pull_request only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: digital-signage-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
